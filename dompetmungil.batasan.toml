[app]
id = "dompetmungil"
repo = "faisalfa123/DompetMungil"
asset = "keuangan-server-linux-aarch64"
language = "go"
description = "Catatan keuangan keluarga ringan bergaya Ghibli, pembaca mutasi bank, dan studio cetak"

[run]
port = 1100
priority = 50

[limits]
memory_max_mb = 64
cpu_quota_pct = 50
tasks_max = 64

[permissions]
paths_rw = ["/var/lib/mastermind/dompetmungil"]
